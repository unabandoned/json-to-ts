name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@93bdc787fc38a6e5b96888ce272b834545908920 # v1.3.3
    with:
      # `files` ships build/src, which tsc generates; npm publish
      # --ignore-scripts never runs prepublishOnly, so the build happens here.
      build-for-publish: true
    secrets: inherit
