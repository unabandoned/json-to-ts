name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@21b556478d51be2e553cb1bf790b54b1812e3fce # v1.3.1
    with:
      # `files` ships build/src, which tsc generates; npm publish
      # --ignore-scripts never runs prepublishOnly, so the build happens here.
      build-for-publish: true
    secrets: inherit
