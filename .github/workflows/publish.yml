name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@e1ac1a12a1502bb95671fc2c747e01195dcf9550 # v1.3.2
    with:
      # `files` ships build/src, which tsc generates; npm publish
      # --ignore-scripts never runs prepublishOnly, so the build happens here.
      build-for-publish: true
    secrets: inherit
