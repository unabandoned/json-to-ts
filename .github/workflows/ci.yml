name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@21b556478d51be2e553cb1bf790b54b1812e3fce # v1.3.1
    with:
      node-versions: '[20, 22, 24]'
      # `npm test` builds first (tsc) and runs the compiled suite, so the
      # separate build step would just compile twice.
      has-build: false
