name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@7df8c67cf681d8fc7ee0831d74c1e9d8640b12a9 # v1.3.4
    with:
      node-versions: '[20, 22, 24]'
      # `npm test` builds first (tsc) and runs the compiled suite, so the
      # separate build step would just compile twice.
      has-build: false
