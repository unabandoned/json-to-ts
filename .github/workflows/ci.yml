name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@23139a663b090be91f54115baa805f4588255aa5 # v1.3.8
    with:
      node-versions: '[20, 22, 24]'
      # `npm test` builds first (tsc) and runs the compiled suite, so the
      # separate build step would just compile twice.
      has-build: false
