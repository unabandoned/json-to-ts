name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@bd9eb6bfc5a567b272e0c6f05703a726a2655531 # v1.1.0
    with:
      node-versions: '[20, 22, 24]'
      # `npm test` builds first (tsc) and runs the compiled suite, so the
      # separate build step would just compile twice.
      has-build: false
