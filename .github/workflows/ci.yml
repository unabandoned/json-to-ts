name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@2212a52dde1417252c73f3a53c864e1aae27ac84 # v1.3.9
    with:
      node-versions: '[20, 22, 24]'
      # `npm test` builds first (tsc) and runs the compiled suite, so the
      # separate build step would just compile twice.
      has-build: false
